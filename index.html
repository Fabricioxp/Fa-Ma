<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fa + Ma</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #f5f5f5;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* Container Principal */
    .app-container {
      width: 100%;
      max-width: 470px;
      border-left: 1px solid #262626;
      border-right: 1px solid #262626;
      padding-bottom: 70px;
      min-height: 100vh;
      background-color: #000000;
    }

    /* Cabeçalho */
    header {
      position: sticky;
      top: 0;
      background-color: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #262626;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Stories */
    .stories-container {
      display: flex;
      gap: 14px;
      padding: 14px;
      border-bottom: 1px solid #262626;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .stories-container::-webkit-scrollbar {
      display: none;
    }

    .story {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.75rem;
      gap: 4px;
    }

    .story-avatar-wrapper {
      padding: 2px;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      border-radius: 50%;
    }

    .story-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid #000;
      object-fit: cover;
    }

    /* Feed Post */
    .post {
      border-bottom: 1px solid #262626;
      padding-bottom: 12px;
    }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
    }

    .post-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
    }

    .post-username {
      font-size: 0.875rem;
      font-weight: 600;
    }

    .post-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .post-actions {
      display: flex;
      gap: 16px;
      padding: 10px 14px;
    }

    .action-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1.4rem;
      transition: transform 0.1s ease;
    }

    .action-btn:active {
      transform: scale(1.2);
    }

    .action-btn.liked {
      color: #ff3040;
    }

    .post-likes {
      font-size: 0.875rem;
      font-weight: 600;
      padding: 0 14px 6px;
    }

    .post-caption {
      font-size: 0.875rem;
      padding: 0 14px 8px;
    }

    .post-caption strong {
      margin-right: 6px;
    }

    .comments-list {
      padding: 0 14px;
      font-size: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comment-item strong {
      margin-right: 6px;
    }

    .add-comment {
      display: flex;
      padding: 8px 14px 0;
      gap: 10px;
      margin-top: 6px;
    }

    .add-comment input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
    }

    .add-comment button {
      background: none;
      border: none;
      color: #0095f6;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* Modal / Barra de Criar Post */
    .create-post-bar {
      position: fixed;
      bottom: 0;
      width: 100%;
      max-width: 470px;
      background-color: #000;
      border-top: 1px solid #262626;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .file-input-wrapper input[type=file] {
      font-size: 100px;
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      cursor: pointer;
    }

    .btn-upload {
      background-color: #262626;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .create-post-bar input[type=text] {
      flex: 1;
      background: #121212;
      border: 1px solid #262626;
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      outline: none;
    }

    .btn-publish {
      background: #0095f6;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Cabeçalho -->
    <header>
      <h1 class="logo">Fa + Ma</h1>
      <span style="font-size: 1.2rem;">💬</span>
    </header>

    <!-- Carrossel de Stories -->
    <div class="stories-container">
      <div class="story">
        <div class="story-avatar-wrapper">
          <img class="story-avatar" src="https://picsum.photos/id/64/100/100" alt="Avatar">
        </div>
        <span>seu_story</span>
      </div>
      <div class="story">
        <div class="story-avatar-wrapper">
          <img class="story-avatar" src="https://picsum.photos/id/65/100/100" alt="Avatar">
        </div>
        <span>felipe</span>
      </div>
      <div class="story">
        <div class="story-avatar-wrapper">
          <img class="story-avatar" src="https://picsum.photos/id/1025/100/100" alt="Avatar">
        </div>
        <span>mariana</span>
      </div>
      <div class="story">
        <div class="story-avatar-wrapper">
          <img class="story-avatar" src="https://picsum.photos/id/338/100/100" alt="Avatar">
        </div>
        <span>ana_p</span>
      </div>
    </div>

    <!-- Feed de Publicações -->
    <main id="feed">
      <!-- Exemplo de Post 1 -->
      <article class="post">
        <div class="post-header">
          <img class="post-avatar" src="https://picsum.photos/id/1025/100/100" alt="Avatar">
          <span class="post-username">mariana</span>
        </div>
        <img class="post-image" src="https://picsum.photos/id/1015/600/500" alt="Post">
        <div class="post-actions">
          <button class="action-btn" onclick="toggleLike(this)">♥</button>
          <button class="action-btn">💬</button>
          <button class="action-btn">✈</button>
        </div>
        <div class="post-likes"><span class="likes-count">124</span> curtidas</div>
        <div class="post-caption">
          <strong>mariana</strong>Um dia perfeito na natureza! 🌿☀️
        </div>
        <div class="comments-list">
          <div class="comment-item"><strong>felipe</strong>Lugar incrível!</div>
        </div>
        <div class="add-comment">
          <input type="text" placeholder="Adicione um comentário..." onkeypress="handleCommentKeyPress(event, this)">
          <button onclick="addComment(this)">Publicar</button>
        </div>
      </article>
    </main>

    <!-- Barra Inferior de Criar Post -->
    <div class="create-post-bar">
      <div class="file-input-wrapper">
        <span class="btn-upload">📷 Foto</span>
        <input type="file" id="file-input" accept="image/*" onchange="previewFile()">
      </div>
      <input type="text" id="caption-input" placeholder="Escreva uma legenda...">
      <button class="btn-publish" onclick="publishPost()">Postar</button>
    </div>
  </div>

  <script>
    let selectedImageSrc = null;

    // Converte a imagem selecionada do computador em URL base64
    function previewFile() {
      const fileInput = document.getElementById('file-input');
      const file = fileInput.files[0];

      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedImageSrc = e.target.result;
          alert('Imagem selecionada com sucesso! Agora digite a legenda e clique em Postar.');
        };
        reader.readAsDataURL(file);
      }
    }

    // Função de Curtir
    function toggleLike(btn) {
      const likesCountElem = btn.closest('.post').querySelector('.likes-count');
      let currentLikes = parseInt(likesCountElem.textContent);

      if (btn.classList.contains('liked')) {
        btn.classList.remove('liked');
        likesCountElem.textContent = currentLikes - 1;
      } else {
        btn.classList.add('liked');
        likesCountElem.textContent = currentLikes + 1;
      }
    }

    // Função de Comentar
    function addComment(btn) {
      const input = btn.previousElementSibling;
      const commentText = input.value.trim();

      if (commentText) {
        const commentsList = btn.closest('.post').querySelector('.comments-list');
        const newComment = document.createElement('div');
        newComment.className = 'comment-item';
        newComment.innerHTML = `<strong>voce</strong>${commentText}`;
        commentsList.appendChild(newComment);
        input.value = '';
      }
    }

    function handleCommentKeyPress(event, input) {
      if (event.key === 'Enter') {
        addComment(input.nextElementSibling);
      }
    }

    // Publicar um novo post no feed
    function publishPost() {
      const captionInput = document.getElementById('caption-input');
      const captionText = captionInput.value.trim();

      if (!selectedImageSrc) {
        alert('Por favor, selecione uma foto primeiro clicando em "📷 Foto".');
        return;
      }

      const feed = document.getElementById('feed');
      const newPost = document.createElement('article');
      newPost.className = 'post';

      newPost.innerHTML = `
        <div class="post-header">
          <img class="post-avatar" src="https://picsum.photos/id/64/100/100" alt="Avatar">
          <span class="post-username">voce</span>
        </div>
        <img class="post-image" src="${selectedImageSrc}" alt="Post">
        <div class="post-actions">
          <button class="action-btn" onclick="toggleLike(this)">♥</button>
          <button class="action-btn">💬</button>
          <button class="action-btn">✈</button>
        </div>
        <div class="post-likes"><span class="likes-count">0</span> curtidas</div>
        <div class="post-caption">
          <strong>voce</strong>${captionText}
        </div>
        <div class="comments-list"></div>
        <div class="add-comment">
          <input type="text" placeholder="Adicione um comentário..." onkeypress="handleCommentKeyPress(event, this)">
          <button onclick="addComment(this)">Publicar</button>
        </div>
      `;

      // Insere o novo post no topo do feed
      feed.insertBefore(newPost, feed.firstChild);

      // Reseta os campos
      captionInput.value = '';
      selectedImageSrc = null;
      document.getElementById('file-input').value = '';
    }
  </script>
</body>
</html>
