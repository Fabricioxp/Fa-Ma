<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Outras Vidas ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a0826, #3a0007, #0d001a);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 90%;
      max-width: 500px;
      padding: 20px;
      z-index: 10;
    }

    /* Tela Inicial */
    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .btn-play {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 65, 108, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-play:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 25px rgba(255, 65, 108, 0.6);
    }

    /* Conteúdo Dinâmico */
    #experience {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 1s forwards;
    }

    .lyrics-box {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 20px 0;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .photo-card {
      width: 250px;
      height: 300px;
      background: #fff;
      padding: 12px 12px 40px 12px;
      border-radius: 8px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      transform: rotate(-3deg);
      transition: all 0.8s ease;
      display: none;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .letter-box {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-top: 20px;
      display: none;
      animation: fadeInUp 1s forwards;
    }

    /* Animações */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Corações e Brilhos */
    .heart {
      position: fixed;
      top: -10px;
      color: #ff4b2b;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(360deg);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Tela Inicial -->
    <div id="start-screen">
      <h1>Tenho algo para te dizer... ✨</h1>
      <p>Aumente o som antes de apertar o botão.</p>
      <button class="btn-play" onclick="startExperience()">Aperte aqui ❤️</button>
    </div>

    <!-- Tela da Experiência -->
    <div id="experience">
      <div id="photo" class="photo-card">
        <img id="photo-img" src="foto1.jpg" alt="Foto dela">
      </div>

      <div id="lyric" class="lyrics-box">...</div>

      <div id="final-letter" class="letter-box">
        <h3>Para a minha princesinha mandona 🥰</h3>
        <p style="margin-top: 10px; font-size: 0.95rem; line-height: 1.5;">
          Não sei em quantas outras vidas a gente já se encontrou, mas tenho certeza de que em todas elas eu escolheria você de novo. Obrigado por fazer parte da minha vida!
        </p>
      </div>
    </div>
  </div>

  <!-- Áudio configurado com o nome mandona.mp3 -->
  <audio id="audio" src="mandona.mp3"></audio>

  <script>
    const audio = document.getElementById('audio');
    const startScreen = document.getElementById('start-screen');
    const experience = document.getElementById('experience');
    const lyricBox = document.getElementById('lyric');
    const photoCard = document.getElementById('photo');
    const photoImg = document.getElementById('photo-img');
    const finalLetter = document.getElementById('final-letter');

    function startExperience() {
      startScreen.style.display = 'none';
      experience.style.display = 'flex';
      audio.play();
      createHearts();
    }

    // Mapeamento exato da gravação mandona.mp3
    audio.ontimeupdate = function() {
      const time = audio.currentTime;

      // 0s a 8s - Introdução com violão e bateria
      if (time > 0 && time < 8) {
        lyricBox.innerText = "Sinta esse momento...";
      }
      // 8s a 23s - Verso 1 (Foto 1 entra em cena)
      else if (time >= 8 && time < 23) {
        lyricBox.innerText = "Me diz quem não fica louco nesse seu jeito meigo...";
        photoCard.style.display = 'block';
        photoImg.src = 'foto1.jpg'; // Coloque o nome da 1ª foto dela aqui
      }
      // 24s a 37s - Verso 2 (Princesinha Mandona)
      else if (time >= 24 && time < 37) {
        lyricBox.innerText = "Minha princesinha mandona... 👑";
      }
      // 38s a 59s - Refrão 1 (Outras Vidas)
      else if (time >= 38 && time < 59) {
        lyricBox.innerText = "Eu acho que já te conhecia de outras vidas! ✨❤️";
        photoCard.style.transform = 'rotate(3deg) scale(1.05)';
      }
      // 1m00s a 1m13s - Solo instrumental
      else if (time >= 60 && time < 73) {
        lyricBox.innerText = "E na outra vida eu também te queria...";
      }
      // 1m14s a 1m28s - Verso 2 (Muda pra Foto 2 se você tiver)
      else if (time >= 74 && time < 88) {
        photoImg.src = 'foto2.jpg'; // Coloque a 2ª foto dela ou mantenha foto1.jpg
        lyricBox.innerText = "Incrível como você me ganha em cada detalhe...";
      }
      // 1m29s a 1m52s - Refrão 2
      else if (time >= 89 && time < 112) {
        lyricBox.innerText = "Pra falar a verdade... Eu te escolheria em todas as vidas! 💖";
      }
      // 1m53s em diante - Final com carta
      else if (time >= 113) {
        lyricBox.innerText = "";
        photoCard.style.display = 'none';
        finalLetter.style.display = 'block';
      }
    };

    // Animação de corações
    function createHearts() {
      setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart');
        heart.innerText = ['❤️', '✨', '💖', '👑'][Math.floor(Math.random() * 4)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = Math.random() * 3 + 2 + 's';
        heart.style.opacity = Math.random();
        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 5000);
      }, 300);
    }
  </script>
</body>
</html>
