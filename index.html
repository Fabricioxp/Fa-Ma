<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De Outras Vidas ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    /* Tema Azul Noite de Van Gogh */
    body {
      background: radial-gradient(circle at center, #112244 0%, #0b1d3a 50%, #050b14 100%);
      color: #fce8b2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    /* Tela Inicial */
    #start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      z-index: 20;
    }

    h1 {
      font-size: 2.2rem;
      color: #f4c430;
      text-shadow: 0 0 15px rgba(244, 196, 48, 0.4);
    }

    p {
      color: #d1d8e0;
      font-size: 1.1rem;
    }

    .btn-main {
      background: linear-gradient(135deg, #f4c430, #e67e22);
      color: #0b1d3a;
      font-weight: bold;
      border: none;
      padding: 16px 36px;
      font-size: 1.2rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(244, 196, 48, 0.5);
      transition: all 0.3s ease;
    }

    .btn-main:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(244, 196, 48, 0.8);
    }

    /* Interface Principal */
    #experience {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 90%;
      max-width: 550px;
      z-index: 10;
    }

    /* Moldura da Foto Estilo Van Gogh */
    .photo-frame {
      width: 260px;
      height: 330px;
      background: #0d2342;
      border: 3px solid #f4c430;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 0 25px rgba(244, 196, 48, 0.3), inset 0 0 15px rgba(0,0,0,0.8);
      margin-bottom: 25px;
      opacity: 0;
      transform: scale(0.9);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .photo-frame.visible {
      opacity: 1;
      transform: scale(1);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
    }

    /* Caixa da Letra */
    .lyric-box {
      font-size: 1.4rem;
      font-style: italic;
      line-height: 1.5;
      min-height: 90px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
    }

    /* Botão de Controle Fixo */
    .controls {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 100;
      display: none;
    }

    .btn-control {
      background: rgba(11, 29, 58, 0.8);
      border: 1px solid #f4c430;
      color: #f4c430;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
      backdrop-filter: blur(5px);
      transition: 0.3s;
    }

    .btn-control:hover {
      background: #f4c430;
      color: #0b1d3a;
    }

    /* Carta Final */
    .final-card {
      background: rgba(13, 35, 66, 0.85);
      border: 2px solid #f4c430;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.7);
      display: none;
      animation: fadeIn 1.5s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Partículas de Estrelas Douradas */
    .star {
      position: fixed;
      background: #f4c430;
      border-radius: 50%;
      pointer-events: none;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- Controles Fixos -->
  <div class="controls" id="controls">
    <button class="btn-control" id="btn-pause" onclick="togglePlay()">⏸️ Pausar</button>
  </div>

  <!-- Tela Inicial -->
  <div id="start-screen">
    <h1>Uma Canção Para Você... 🌌</h1>
    <p>Aumente o som e prepare o coração.</p>
    <button class="btn-main" onclick="startExperience()">Iniciar Experiência ✨</button>
  </div>

  <!-- Experiência Principal -->
  <div id="experience">
    <div id="photo-frame" class="photo-frame">
      <img id="photo-img" src="foto1.jpg" alt="Ela">
    </div>

    <div id="lyric-display" class="lyric-box">...</div>

    <div id="final-card" class="final-card">
      <h2 style="color: #f4c430; margin-bottom: 15px;">Para a minha princesinha mandona ❤️</h2>
      <p style="font-size: 1.05rem; line-height: 1.6; color: #e2e8f0;">
        Seja nessa vida ou em todas as outras que virão, eu sempre iria te procurar e me apaixonar de novo por esse seu jeito único. Obrigado por iluminar a minha vida como as estrelas no céu.
      </p>
    </div>
  </div>

  <audio id="audio" src="mandona.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    const startScreen = document.getElementById('start-screen');
    const experience = document.getElementById('experience');
    const controls = document.getElementById('controls');
    const btnPause = document.getElementById('btn-pause');
    const lyricDisplay = document.getElementById('lyric-display');
    const photoFrame = document.getElementById('photo-frame');
    const photoImg = document.getElementById('photo-img');
    const finalCard = document.getElementById('final-card');

    // Mapeamento COMPLETO da letra e fotos sincronizadas por segundo exacto da música
    const timeline = [
      { time: 0, lyric: "Sinta o ritmo da música...", photo: null },
      { time: 8, lyric: "Me diz quem não fica louco...", photo: "foto1.jpg" },
      { time: 13, lyric: "Nesse jeito meigo e bobo seu... 💙", photo: "foto1.jpg" },
      { time: 19, lyric: "Um jeito bobo seu...", photo: "foto2.jpg" },
      { time: 24, lyric: "Me diz quem não se apaixona...", photo: "foto3.jpg" },
      { time: 29, lyric: "Na princesinha mandona, eu sei... 👑", photo: "foto3.jpg" },
      { time: 34, lyric: "Mas só liguei pra te dizer...", photo: "foto4.jpg" },
      { time: 38, lyric: "Pra falar a verdade, eu acho que já te conhecia de outras vidas!", photo: "foto5.jpg" },
      { time: 48, lyric: "Pra falar a verdade, eu acho que na última vida eu também te queria! ✨", photo: "foto6.jpg" },
      { time: 54, lyric: "Na outra vida eu também te queria... ❤️", photo: "foto7.jpg" },
      { time: 60, lyric: "(Pra falar a verdade...)", photo: "foto8.jpg" },
      { time: 64, lyric: "Eu acho que já te conhecia de outras vidas!", photo: "foto9.jpg" },
      { time: 70, lyric: "Na última vida eu também te queria...", photo: "foto10.jpg" },
      { time: 76, lyric: "Na outra vida eu também te queria! 🌌", photo: "foto11.jpg" },
      { time: 82, lyric: "Na outra vida eu também te queria...", photo: "foto12.jpg" },
      { time: 94, lyric: "Me diz quem não fica louco...", photo: "foto13.jpg" },
      { time: 98, lyric: "Nesse jeito meigo e bobo seu... 💙", photo: "foto14.jpg" },
      { time: 105, lyric: "Jeito bobo seu...", photo: "foto15.jpg" },
      { time: 110, lyric: "Pra falar a verdade, eu acho que já te conhecia de outras vidas!", photo: "foto16.jpg" },
      { time: 119, lyric: "Pra falar a verdade, eu acho que na última vida eu também te queria!", photo: "foto17.jpg" },
      { time: 125, lyric: "Na outra vida eu também te queria...", photo: "foto18.jpg" },
      { time: 131, lyric: "Pra falar a verdade...", photo: "foto19.jpg" },
      { time: 135, lyric: "Eu acho que já te conhecia de outras vidas! ✨", photo: "foto20.jpg" },
      { time: 141, lyric: "Na última vida eu também te queria!", photo: "foto21.jpg" },
      { time: 147, lyric: "Na outra vida eu também te queria...", photo: "foto22.jpg" },
      { time: 153, lyric: "Na outra vida eu também te queria! 💙", photo: "foto23.jpg" },
      { time: 162, lyric: "Na outra vida eu também te queria... ✨", photo: "foto24.jpg" },
      { time: 173, lyric: "Fim...", photo: null, end: true }
    ];

    let currentPhotoSrc = "";

    function startExperience() {
      startScreen.style.display = 'none';
      experience.style.display = 'flex';
      controls.style.display = 'block';
      generateStars();
      audio.play();
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play();
        btnPause.innerHTML = "⏸️ Pausar";
      } else {
        audio.pause();
        btnPause.innerHTML = "▶️ Continuar";
      }
    }

    // Atualização em Tempo Real (Evita bugs de sincronização ao pausar/despausar)
    audio.ontimeupdate = function() {
      const currentTime = audio.currentTime;

      // Busca o evento correto da linha do tempo correspondente ao tempo atual
      let activeEvent = null;
      for (let i = 0; i < timeline.length; i++) {
        if (currentTime >= timeline[i].time) {
          activeEvent = timeline[i];
        }
      }

      if (activeEvent) {
        // Atualiza a letra se mudou
        if (lyricDisplay.innerText !== activeEvent.lyric) {
          lyricDisplay.innerText = activeEvent.lyric;
        }

        // Se o evento final for atingido, mostra a carta
        if (activeEvent.end) {
          photoFrame.classList.remove('visible');
          lyricDisplay.style.display = 'none';
          finalCard.style.display = 'block';
          return;
        }

        // Atualiza a foto se houver foto nova e evita recarregar a mesma foto
        if (activeEvent.photo) {
          if (currentPhotoSrc !== activeEvent.photo) {
            currentPhotoSrc = activeEvent.photo;
            photoImg.src = activeEvent.photo;
            photoFrame.classList.add('visible');
          }
        } else {
          photoFrame.classList.remove('visible');
        }
      }
    };

    // Criação de estrelas cintilantes no fundo estilo Van Gogh
    function generateStars() {
      for (let i = 0; i < 60; i++) {
        const star = document.createElement('div');
        star.classList.add('star');
        const size = Math.random() * 4 + 2;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.animationDelay = Math.random() * 3 + 's';
        document.body.appendChild(star);
      }
    }
  </script>
</body>
</html>
